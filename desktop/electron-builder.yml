appId: dk.bircck.deckshelf
productName: DeckShelf
asar: true
# Reuse the exact runtime installed by npm ci; avoid a second download/extraction.
electronDist: node_modules/electron/dist
afterPack: scripts/after-pack.mjs
directories:
  output: build/windows
files:
  - dist/**/*
  - desktop/**/*
  - '!desktop/electron-builder.yml'
  - '!desktop/installer.nsh'
  - '!desktop/icon.ico'
  - server/api.mjs
  - server/sources.mjs
  - package.json
  - '!node_modules/**/*'
extraResources:
  - from: docs/DESKTOP.md
    to: DESKTOP.md
  - from: docs/THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  - from: LICENSE.md
    to: LICENSE.md
  - from: build/notices
    to: notices
win:
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  artifactName: DeckShelf-${version}-windows-${arch}.${ext}
  # Rendered by scripts/app-icons.mjs; also used for the installer and uninstaller.
  icon: desktop/icon.ico
  # Unsigned, but still let electron-builder write the icon and version details into the exe.
  signExecutable: false
nsis:
  artifactName: DeckShelf-Setup-${version}-x64.exe
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: false
  createStartMenuShortcut: true
  shortcutName: DeckShelf
  uninstallDisplayName: DeckShelf
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  include: desktop/installer.nsh
publish: null
