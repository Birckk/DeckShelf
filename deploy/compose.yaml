name: deckshelf
services:
  deckshelf:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: deckshelf:local
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:4317:4317"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 100
