name: Release candidate
# The one place the slow checks run: every release tests the Windows app and all three
# browser engines before an image or a draft release exists. Day-to-day changes are
# checked locally (docs/DEVELOPMENT.md).
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Validate release version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Use a stable semantic package version.' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match package.json version.' }
          if (-not (Select-String -Path docs/RELEASE_NOTES.md -SimpleMatch "DeckShelf $version" -Quiet)) { throw 'Update release notes for this version.' }
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run package:windows
      - run: npm run test:desktop
      - shell: pwsh
        run: ./scripts/smoke-installer.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: |
            release/*Setup*.exe
            release/*.zip
            release/*.txt
            release/*.md
            release/build-info.json
          if-no-files-found: error
          # The draft release keeps the files; this copy only needs to reach that job.
          retention-days: 7
  # Firefox takes about 16 minutes and WebKit about 15 on a runner.
  browsers:
    name: browsers (${{ matrix.browser }})
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --browser=${{ matrix.browser }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-results-${{ matrix.browser }}
          path: test-results/
          retention-days: 7
  image:
    if: github.ref_type == 'tag'
    needs: [windows, browsers]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          provenance: true
          sbom: true
          tags: |
            ghcr.io/birckk/deckshelf:${{ github.ref_name }}
            ghcr.io/birckk/deckshelf:latest
          labels: org.opencontainers.image.source=https://github.com/Birckk/DeckShelf
  draft:
    if: github.ref_type == 'tag'
    needs: [windows, browsers, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows-release
          path: assets
      - name: Create draft release for owner review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" assets/* --verify-tag --draft --title "DeckShelf $RELEASE_TAG" --notes-file assets/RELEASE_NOTES.md
