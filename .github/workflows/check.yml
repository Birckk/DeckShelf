name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web-container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: docker build -t deckshelf:test .
      - run: docker run -d --name deckshelf-test --read-only --cap-drop ALL --security-opt no-new-privileges --memory 256m -p 127.0.0.1:4319:4317 deckshelf:test
      - run: node scripts/smoke-web.mjs
      - run: node scripts/smoke-guide.mjs
        env:
          BASE_URL: http://127.0.0.1:4319
      - run: node scripts/smoke-demo.mjs
        env:
          BASE_URL: http://127.0.0.1:4319
      - if: failure()
        run: docker logs deckshelf-test
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-screenshots
          path: |
            qa/web/
            qa/demo/
            qa/guide/
  publish-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test-and-build, web-container]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/bircck/deckshelf:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/Bircck/DeckShelf
  test-and-build:
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - if: runner.os == 'Windows'
        run: npm run package:windows
      - if: runner.os == 'Windows'
        run: npm run test:desktop
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke-installer.ps1
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-candidate
          path: |
            release/*Setup*.exe
            release/*.zip
            release/*.txt
            release/*.md
            release/build-info.json
          if-no-files-found: error
