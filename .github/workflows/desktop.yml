name: Desktop
# Runs on pull requests that change desktop packaging, and on demand before a release;
# release.yml repeats the package checks for tags.
on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'scripts/after-pack.mjs'
      - 'scripts/release-assets.mjs'
      - 'scripts/smoke-desktop.mjs'
      - 'scripts/smoke-installer.ps1'
      - 'scripts/smoke-upgrade.mjs'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Windows installer and ZIP: package, run the app, upgrade from Commander Archive,
  # install/reinstall/uninstall.
  desktop:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package:windows
      - run: npm run test:desktop
      # The last build named Commander Archive, installed first to test a real upgrade.
      - uses: actions/checkout@v7
        with:
          ref: bb82435c05e34eb35bd73f087af70f9d33e8ad88
          path: qa/legacy-source
      - name: Package Commander Archive
        working-directory: qa/legacy-source
        run: |
          npm ci
          npm run package:windows
      - shell: pwsh
        run: ./scripts/smoke-installer.ps1 -LegacySetup (Resolve-Path qa/legacy-source/release/Commander-Archive-Setup-*-x64.exe).Path
      # About 256 MB per run; Actions storage is billed, so keep it briefly.
      - uses: actions/upload-artifact@v7
        with:
          name: windows-candidate
          path: |
            release/*Setup*.exe
            release/*.zip
            release/*.txt
            release/*.md
            release/build-info.json
          if-no-files-found: error
          retention-days: 3
