name: CI
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Unit tests and production build wherever people run the app from source.
  unit:
    name: unit (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22]
        include:
          - os: ubuntu-latest
            node: 24
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm audit --omit=dev --audit-level=high

  # Browser regressions against the dev server in all three engines.
  browsers:
    name: browsers (${{ matrix.browser }})
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --browser=${{ matrix.browser }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-results-${{ matrix.browser }}
          path: test-results/
          retention-days: 7

  # The hardened production container, smoke-tested at desktop and phone sizes.
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: docker build -f deploy/Dockerfile -t deckshelf:test .
      - run: docker run -d --name deckshelf-test --read-only --cap-drop ALL --security-opt no-new-privileges --memory 256m -p 127.0.0.1:4319:4317 deckshelf:test
      - run: node scripts/smoke-web.mjs
      - run: node scripts/smoke-guide.mjs
        env:
          BASE_URL: http://127.0.0.1:4319
      - run: node scripts/smoke-demo.mjs
        env:
          BASE_URL: http://127.0.0.1:4319
      - if: failure()
        run: docker logs deckshelf-test
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-screenshots
          path: |
            qa/web/
            qa/demo/
            qa/guide/
          retention-days: 7

  # Windows installer and ZIP: package, run the app, upgrade from Commander Archive,
  # install/reinstall/uninstall.
  desktop:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package:windows
      - run: npm run test:desktop
      # The last build named Commander Archive, installed first to test a real upgrade.
      - uses: actions/checkout@v7
        with:
          ref: f39259699cf34d5a16bd26b5218a99497e3937d4
          path: qa/legacy-source
      - name: Package Commander Archive
        working-directory: qa/legacy-source
        run: |
          npm ci
          npm run package:windows
      - shell: pwsh
        run: ./scripts/smoke-installer.ps1 -LegacySetup (Resolve-Path qa/legacy-source/release/Commander-Archive-Setup-*-x64.exe).Path
      - uses: actions/upload-artifact@v7
        with:
          name: windows-candidate
          path: |
            release/*Setup*.exe
            release/*.zip
            release/*.txt
            release/*.md
            release/build-info.json
          if-no-files-found: error
          retention-days: 14

  # Every green main commit becomes an immutable image; deployments pin its digest.
  publish-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [unit, browsers, container, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          provenance: true
          sbom: true
          tags: |
            ghcr.io/bircck/deckshelf:sha-${{ github.sha }}
            ghcr.io/bircck/deckshelf:main
          labels: org.opencontainers.image.source=https://github.com/Bircck/DeckShelf
