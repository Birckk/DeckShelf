name: CI
# Runs on every pull request and main push. Pull requests have no path filter, so the
# checks the main ruleset requires always report. Green main pushes publish the image.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Also test Windows, macOS, Node 24, Firefox and WebKit
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# The default run is Linux only (Windows bills 2x, macOS 10x); choose "full" for the
# whole matrix. desktop.yml covers the Windows package.
jobs:
  # Unit tests and production build wherever people run the app from source.
  unit:
    name: unit (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.full && '[{"os":"ubuntu-latest","node":22},{"os":"windows-latest","node":22},{"os":"macos-latest","node":22},{"os":"ubuntu-latest","node":24}]' || '[{"os":"ubuntu-latest","node":22}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm audit --omit=dev --audit-level=high

  # Browser regressions against the dev server: Chromium by default, all three
  # engines on a full run.
  browsers:
    name: browsers (${{ matrix.browser }})
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(inputs.full && '["chromium","firefox","webkit"]' || '["chromium"]') }}
    runs-on: ubuntu-latest
    # Firefox takes about 16 minutes on a runner, and WebKit ran past 20 without a failure.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --browser=${{ matrix.browser }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-results-${{ matrix.browser }}
          path: test-results/
          retention-days: 7

  # The hardened production container, smoke-tested at desktop and phone sizes.
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: docker build -f deploy/Dockerfile -t deckshelf:test .
      - run: docker run -d --name deckshelf-test --read-only --cap-drop ALL --security-opt no-new-privileges --memory 256m -p 127.0.0.1:4319:4317 deckshelf:test
      - run: node scripts/smoke-web.mjs
      - run: node scripts/smoke-guide.mjs
        env:
          BASE_URL: http://127.0.0.1:4319
      - run: node scripts/smoke-demo.mjs
        env:
          BASE_URL: http://127.0.0.1:4319
      - if: failure()
        run: docker logs deckshelf-test
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-screenshots
          path: |
            qa/web/
            qa/demo/
            qa/guide/
          retention-days: 7

  # Every green main commit becomes an immutable image; deployments pin its digest.
  publish-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [unit, browsers, container]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          provenance: true
          sbom: true
          tags: |
            ghcr.io/bircck/deckshelf:sha-${{ github.sha }}
            ghcr.io/bircck/deckshelf:main
          labels: org.opencontainers.image.source=https://github.com/Bircck/DeckShelf
